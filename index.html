<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Conocimiento</title>

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f4f6f9;
}

header{
background:#003366;
color:white;
padding:40px;
text-align:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card a{
text-decoration:none;
color:#003366;
font-weight:bold;
}

footer{
text-align:center;
padding:20px;
background:#003366;
color:white;
}

</style>

</head>
<body>

<header>
<h1>🎓 Centro de Conocimiento</h1>
<p>Atención al Estudiante</p>
</header>

<section class="cards">

<div class="card">
<h2>📚 Documentación</h2>
<a href="#">Ingresar</a>
</div>

<div class="card">
<h2>🔄 Flujos</h2>
<a href="#">Ingresar</a>
</div>

<div class="card">
<h2>❓ FAQ</h2>
<a href="#">Ingresar</a>
</div>

<div class="card">
<h2>🚨 Escalamientos</h2>
<a href="#">Ingresar</a>
</div>

<div class="card">
<h2>🎥 Capacitaciones</h2>
<a href="#">Ingresar</a>
</div>

<div class="card">
<h2>👥 Directorio</h2>
<a href="#">Ingresar</a>
</div>

</section>

<footer>
Portal de Atención al Estudiante
</footer>

</body>
</html>
